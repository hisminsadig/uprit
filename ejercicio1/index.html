<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Formulario para completar un currículum vitae.">
  <title>Currículum Vitae | Ejercicio 01</title>
  <style>
    :root { color-scheme: light; --ink:#172b4d; --muted:#63748b; --accent:#2767a5; --line:#a9b8c9; }
    * { box-sizing:border-box; }
    body { margin:0; padding:22px 14px; background:#edf2f7; color:#243448; font:14px/1.4 Arial, sans-serif; }
    .cv { max-width:850px; margin:auto; padding:clamp(20px,4vw,38px); background:#fff; border-radius:14px; box-shadow:0 15px 45px #19365318; }
    .header { display:flex; flex-direction:row; align-items:center; justify-content:space-between; gap:22px; padding-bottom:18px; border-bottom:2px solid var(--ink); }
    .header h1 { margin:0; color:var(--ink); font-size:clamp(25px,4vw,36px); letter-spacing:.08em; }
    .header p { margin:5px 0 0; color:var(--muted); }
    .photo { flex:none; display:grid; place-items:center; width:94px; height:112px; border:1px dashed #8b9bb0; border-radius:8px; color:var(--muted); font-size:12px; }
    section { margin-top:22px; }
    h2 { margin:0 0 12px; padding-bottom:7px; border-bottom:1px solid #dce4ec; color:var(--ink); font-size:15px; letter-spacing:.09em; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:13px 20px; }
    .field { display:flex; flex-direction:column; gap:4px; min-width:0; }
    .wide { grid-column:1/-1; }
    label { color:#42536a; font-size:13px; font-weight:600; }
    input:not([type=submit]):not([type=reset]), textarea { width:100%; min-height:35px; padding:5px 3px; border:0; border-bottom:1px dotted var(--line); border-radius:0; outline:0; background:transparent; color:var(--ink); font:inherit; transition:border-color .2s, border-width .2s; }
    textarea { min-height:90px; resize:vertical; border:1px dotted var(--line); padding:9px; }
    input:focus, textarea:focus { border-color:var(--accent)!important; border-bottom-style:solid!important; }
    .note { margin:20px 0 13px; color:var(--muted); font-size:13px; }
    .actions { display:flex; justify-content:flex-end; gap:12px; padding-top:20px; border-top:1px solid #e1e7ee; }
    button { padding:11px 19px; border:1px solid var(--ink); border-radius:7px; background:#fff; color:var(--ink); font-weight:700; cursor:pointer; }
    button[type=submit] { background:var(--ink); color:white; }
    button:hover { filter:brightness(1.12); }
    @media(max-width:600px) { body { padding:14px 9px; } .cv { padding:22px 17px; } .grid { grid-template-columns:1fr; gap:15px; } .wide { grid-column:auto; } .header { align-items:flex-start; } .photo { width:70px; height:88px; } .actions { flex-direction:column-reverse; } button { width:100%; } }
  </style>
</head>
<body>
  <form class="cv" action="enviacurriculo.htm" method="post">
    <header class="header"><div><h1>CURRÍCULUM VITAE</h1><p>Completa tus datos para presentar tu perfil profesional.</p></div><div class="photo" aria-label="Espacio para fotografía">FOTOGRAFÍA</div></header>
    <section><h2>DATOS PERSONALES</h2><div class="grid">
      <div class="field"><label for="apellidos">Apellidos *</label><input id="apellidos" name="apellidos" autocomplete="family-name" required></div>
      <div class="field"><label for="nombre">Nombre *</label><input id="nombre" name="nombre" autocomplete="given-name" required></div>
      <div class="field"><label for="dni">DNI *</label><input id="dni" name="dni" inputmode="numeric" maxlength="8" pattern="[0-9]{8}" title="Ingresa 8 dígitos" required></div>
      <div class="field"><label for="fecha_nacimiento">Fecha de nacimiento</label><input id="fecha_nacimiento" type="date" name="fecha_nacimiento"></div>
      <div class="field"><label for="lugar">Lugar de nacimiento</label><input id="lugar" name="lugar"></div>
      <div class="field wide"><label for="direccion">Dirección</label><input id="direccion" name="direccion" autocomplete="street-address"></div>
      <div class="field"><label for="localidad">Localidad</label><input id="localidad" name="localidad"></div>
      <div class="field"><label for="provincia">Provincia</label><input id="provincia" name="provincia"></div>
      <div class="field"><label for="telefono">Teléfono</label><input id="telefono" type="tel" name="telefono" autocomplete="tel"></div>
      <div class="field"><label for="movil">Teléfono móvil</label><input id="movil" type="tel" name="movil"></div>
      <div class="field wide"><label for="email">Correo electrónico *</label><input id="email" type="email" name="email" autocomplete="email" required></div>
    </div></section>
    <section><h2>FORMACIÓN Y ESTUDIOS</h2><div class="grid">
      <div class="field wide"><label for="titulacion">Titulación</label><input id="titulacion" name="titulacion"></div>
      <div class="field"><label for="idiomas">Idiomas</label><input id="idiomas" name="idiomas"></div>
      <div class="field"><label for="informatica">Conocimientos informáticos</label><input id="informatica" name="informatica"></div>
      <div class="field wide"><label for="cursos">Cursos y seminarios</label><input id="cursos" name="cursos"></div>
    </div></section>
    <section><h2>EXPERIENCIA PROFESIONAL</h2><div class="grid">
      <div class="field wide"><label for="empresa">Empresa</label><input id="empresa" name="empresa"></div>
      <div class="field"><label for="fecha_experiencia">Fecha</label><input id="fecha_experiencia" type="date" name="fecha_experiencia"></div>
      <div class="field"><label for="puesto">Puesto / actividad desarrollada</label><input id="puesto" name="puesto"></div>
    </div></section>
    <section><h2>DATOS COMPLEMENTARIOS</h2><div class="field"><label for="datos_complementarios">Información adicional</label><textarea id="datos_complementarios" name="datos_complementarios" rows="4"></textarea></div></section>
    <p class="note">Declaro que la información proporcionada puede ser acreditada en caso de solicitud.</p>
    <div class="grid"><div class="field"><label for="lugar_actual">Lugar</label><input id="lugar_actual" name="lugar_actual"></div><div class="field"><label for="fecha_actual">Fecha</label><input id="fecha_actual" type="date" name="fecha_actual"></div></div>
    <div class="actions"><button type="reset">Limpiar formulario</button><button type="submit">Enviar currículum</button></div>
  </form>
</body>
</html>
