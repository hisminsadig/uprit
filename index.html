<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Actividad HTML · Sesión 5</title>
  <style>
    :root { font-family: Arial, Helvetica, sans-serif; color: #17243c; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center;
      padding: 32px 16px;
      background: radial-gradient(circle at 15% 10%, #dbeafe 0, transparent 35%),
                  linear-gradient(145deg, #f8fbff, #e9f0f8);
    }
    main { width: min(100%, 620px); text-align: center; }
    h1 { margin: 0 0 6px; font-size: clamp(28px, 5vw, 38px); letter-spacing: -.04em; text-shadow: 0 2px 0 #f2a23a, 0 4px 10px rgba(231,137,35,.62); }
    .session { margin: 0 0 14px; color: #677b95; font-size: 15px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .logo { display: block; width: 120px; height: 120px; object-fit: contain; margin: 0 auto 10px; filter: drop-shadow(0 5px 9px rgba(25,55,100,.22)); transition: transform .35s ease, filter .35s ease; }
    .logo:hover { transform: translateY(-4px) rotate(-3deg) scale(1.05); filter: drop-shadow(0 10px 12px rgba(25,55,100,.32)); }
    .university { margin: 0 0 18px; color: #800020; font-size: clamp(25px, 5vw, 34px); font-weight: 800; letter-spacing: .02em; line-height: 1.2; -webkit-text-stroke: 2px #fff; paint-order: stroke fill; filter: drop-shadow(3px 4px 3px rgba(0,0,0,.8)); }
    .details { display: grid; gap: 12px; margin: 0; padding: 12px 20px; }
    .detail { margin: 0; }
    dt { margin-bottom: 2px; color: #677b95; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    dd { margin: 0; font-size: 19px; line-height: 1.3; font-weight: 600; }
    nav { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; margin-top: 22px; }
    .button { display: block; padding: 16px 20px; background: linear-gradient(135deg,#3269b4,#214e91); color: #fff; font-size: 16px; font-weight: 700; text-decoration: none; border-radius: 11px; box-shadow: 0 6px 15px rgba(29,74,139,.2); transition: transform .2s, box-shadow .2s; }
    .button:hover { transform: translateY(-2px); box-shadow: 0 9px 18px rgba(29,74,139,.27); }
    .button:focus-visible { outline: 3px solid #bc2435; outline-offset: 4px; }
    @media (max-width: 480px) { nav { grid-template-columns: 1fr; } dd { font-size: 14px; } }
    @media (prefers-reduced-motion: reduce) { .logo, .button { transition: none; } .logo:hover { transform: none; } }
  </style>
</head>
<body>
  <main>
    <h1>Actividad HTML &amp; CSS</h1>
    <p class="session">Sesión 5</p>
    <img class="logo" src="imagenes/INSIGNIA_UPRIT.png" alt="Logo de la Universidad Privada de Trujillo">
    <p class="university">UNIVERSIDAD PRIVADA DE TRUJILLO</p>
    <dl class="details" aria-label="Datos de la actividad">
      <div class="detail"><dt>Curso</dt><dd>Lenguaje, Pensamiento y Cognición Visual</dd></div>
      <div class="detail"><dt>Docente</dt><dd>Mg. Ing. JOSE ARTURO DIAZ PULIDO</dd></div>
      <div class="detail"><dt>Carrera</dt><dd>INGENIERÍA DE SISTEMAS E IA</dd></div>
      <div class="detail"><dt>Sección</dt><dd>"A"</dd></div>
      <div class="detail"><dt>Estudiante</dt><dd>IVAN TEODOLIO MOYAHUAYTAN</dd></div>
    </dl>
    <nav aria-label="Ejercicios">
      <a class="button" href="ejercicio1/index.html">Ejercicio 01</a>
      <a class="button" href="ejercicio2/index.html">Ejercicio 02</a>
    </nav>
  </main>
</body>
</html>
